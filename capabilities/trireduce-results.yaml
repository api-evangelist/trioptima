naftiko: 1.0.0-alpha2
info:
  label: Trioptima triReduce API — Results
  description: 'Trioptima triReduce API — Results. 2 operations. Lead operation: Get Cycle Results. Self-contained Naftiko
    capability covering one Trioptima business surface.'
  tags:
  - Trioptima
  - Results
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIOPTIMA_API_KEY: TRIOPTIMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: trireduce-results
    baseUri: https://rates.trireduce.com/api/v1
    description: Trioptima triReduce API — Results business capability. Self-contained, no shared references.
    resources:
    - name: cycles-cycleId-results
      path: /cycles/{cycleId}/results
      operations:
      - name: getcycleresults
        method: GET
        description: Get Cycle Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cycleId
          in: path
          type: string
          description: Unique identifier for the compression cycle
          required: true
    - name: cycles-cycleId-results-confirm
      path: /cycles/{cycleId}/results/confirm
      operations:
      - name: confirmcycleresults
        method: POST
        description: Confirm Cycle Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cycleId
          in: path
          type: string
          description: Unique identifier for the compression cycle
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRIOPTIMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: trireduce-results-rest
    port: 8080
    description: REST adapter for Trioptima triReduce API — Results. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cycles/{cycleid}/results
      name: cycles-cycleid-results
      description: REST surface for cycles-cycleId-results.
      operations:
      - method: GET
        name: getcycleresults
        description: Get Cycle Results
        call: trireduce-results.getcycleresults
        with:
          cycleId: rest.cycleId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cycles/{cycleid}/results/confirm
      name: cycles-cycleid-results-confirm
      description: REST surface for cycles-cycleId-results-confirm.
      operations:
      - method: POST
        name: confirmcycleresults
        description: Confirm Cycle Results
        call: trireduce-results.confirmcycleresults
        with:
          cycleId: rest.cycleId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trireduce-results-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trioptima triReduce API — Results. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-cycle-results
      description: Get Cycle Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trireduce-results.getcycleresults
      with:
        cycleId: tools.cycleId
      outputParameters:
      - type: object
        mapping: $.
    - name: confirm-cycle-results
      description: Confirm Cycle Results
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: trireduce-results.confirmcycleresults
      with:
        cycleId: tools.cycleId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
